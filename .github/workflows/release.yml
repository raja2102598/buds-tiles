name: Release

# Push a tag like v1.0.0 to publish a signed APK as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Add the SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD repository secrets."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_KEYSTORE_PATH"
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :app:assembleRelease \
            -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "buds-tiles-$VERSION.apk"
          rm "$SIGNING_KEYSTORE_PATH"

      - uses: softprops/action-gh-release@v2
        with:
          files: buds-tiles-*.apk
          generate_release_notes: true
